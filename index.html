<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tra Cứu Văn Bản Pháp Quy - Hải Quan & Thuế</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .hover-row:hover { background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

    <div class="max-w-7xl mx-auto bg-white rounded-lg shadow-lg p-8">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-700 uppercase mb-2">Hệ Thống Tra Cứu Văn Bản Hải Quan</h1>
            <p class="text-gray-500">Tra cứu siêu tốc Nghị định, Thông tư và Công văn hướng dẫn nghiệp vụ</p>
        </div>

        <div class="relative mb-6">
            <input type="text" id="searchInput" 
                class="w-full border-2 border-blue-400 rounded-lg p-4 pl-12 text-lg focus:outline-none focus:ring-2 focus:ring-blue-600 transition"
                placeholder="Nhập số hiệu, trích yếu, hoặc từ khóa (VD: 38/2015, Ure, Hóa đơn...)"
                onkeyup="filterData()">
            <svg class="w-6 h-6 text-gray-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>

        <div class="mb-4 text-gray-600 font-medium italic" id="resultStats">
            Đang tải dữ liệu từ file Excel (CSV)...
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-100 text-blue-800 border-b-2 border-blue-200">
                        <th class="p-4 font-semibold w-12">STT</th>
                        <th class="p-4 font-semibold w-32">Cơ Quan</th>
                        <th class="p-4 font-semibold w-32">Loại VB</th>
                        <th class="p-4 font-semibold w-32">Số Hiệu</th>
                        <th class="p-4 font-semibold">Trích Yếu & Từ Khóa</th>
                        <th class="p-4 font-semibold w-32">Tình Trạng</th>
                        <th class="p-4 font-semibold w-24 text-center">Chi Tiết</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        let database = [];

        function removeAccents(str) {
            if (!str) return "";
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        // TỰ ĐỘNG ĐỌC FILE data.csv
        Papa.parse("data.csv", {
            download: true,
            header: false, 
            skipEmptyLines: true,
            complete: function(results) {
                // Bỏ qua dòng đầu tiên (dòng tiêu đề của Excel)
                const rawData = results.data.slice(1);
                
                // Gắn 6 cột của Excel vào hệ thống
                database = rawData.map(row => ({
                    coQuan: row[0] || "",
                    loai: row[1] || "",
                    soHieu: row[2] || "",
                    trichYeu: row[3] || "",
                    tinhTrang: row[4] || "",
                    link: row[5] || "#"
                }));
                
                // Gọi hàm hiển thị sau khi đã tải xong dữ liệu
                filterData();
            },
            error: function() {
                document.getElementById("resultStats").innerHTML = "<span class='text-red-500'>Lỗi: Không tìm thấy file data.csv. Bạn đã tải file lên GitHub chưa?</span>";
            }
        });

        // HÀM HIỂN THỊ VÀ TÌM KIẾM
        function filterData() {
            const startTime = performance.now();
            const keyword = removeAccents(document.getElementById("searchInput").value);
            
            const filteredData = database.filter(item => {
                const textToSearch = removeAccents(item.soHieu + " " + item.trichYeu + " " + item.loai + " " + item.coQuan);
                return textToSearch.includes(keyword);
            });

            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = ""; 

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500 font-medium">Không tìm thấy dữ liệu.</td></tr>`;
                document.getElementById("resultStats").innerHTML = "";
                return;
            }

            filteredData.forEach((item, index) => {
                let row = `<tr class="border-b border-gray-200 hover-row transition">
                    <td class="p-4">${index + 1}</td>
                    <td class="p-4">${item.coQuan}</td>
                    <td class="p-4"><span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-sm">${item.loai}</span></td>
                    <td class="p-4 font-bold text-blue-700">${item.soHieu}</td>
                    <td class="p-4 text-gray-800">${item.trichYeu}</td>
                    <td class="p-4"><span class="font-medium ${item.tinhTrang.includes('HẾT') ? 'text-red-600' : 'text-green-600'}">${item.tinhTrang}</span></td>
                    <td class="p-4 text-center">
                        <a href="${item.link}" target="_blank" class="text-blue-600 hover:text-blue-800 underline">Xem</a>
                    </td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });

            const endTime = performance.now();
            document.getElementById("resultStats").innerHTML = 
                `Tìm thấy <strong class="text-blue-700">${filteredData.length}</strong> kết quả trong <strong>${(endTime - startTime).toFixed(1)}ms</strong>`;
        }
    </script>
</body>
</html>
